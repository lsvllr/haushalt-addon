# Version setzt die GitHub Action bei jedem Build auf das Tag des Images (sha-<7 Zeichen>).
name: Haushalt
description: Aufgaben, Einkauf, Ausgaben und Wohnkosten für das Zuhause
version: "sha-0d99633"
slug: haushalt
url: https://github.com/lsvllr/haushalt-addon
arch:
  - aarch64
  - amd64
image: ghcr.io/lsvllr/haushalt-tracker
init: false
startup: application
boot: auto
# Während der HA-Sicherung kurz stoppen: SQLite wird dann sauber gesichert.
backup: cold
# HA startet das Add-on neu, wenn /healthz nicht mehr antwortet.
watchdog: http://[HOST]:[PORT:8000]/healthz
# Zeit zum sauberen Beenden (laufende Anfragen, SQLite-Checkpoint), bevor HA hart stoppt.
timeout: 20
# Daten (SQLite, Schlüssel) in /config, in HA unter /addon_configs/<id>_haushalt (Samba-Freigabe addon_configs).
map:
  - addon_config:rw
# Kein Port nach außen: erreichbar im HA-Netz unter <Hostname>:8000 (Hostname auf der Info-Seite),
# öffentlich über das Cloudflared-Add-on.
options:
  app_url: "https://haus.vollrath.app"
  secret_key: ""
  reminder_hour: 8
  cron_token: ""
  admin_password: ""
  gemini_api_key: ""
  allow_legacy_sessions: true
  # Push an die iOS-App (APNs). Schlüsseldatei als apns.p8 in den Datenordner legen (Samba: addon_configs/…_haushalt).
  apns_key_id: "79L98BT2Z6"
  apns_team_id: "GT7LHGM254"
  apns_topic: "de.eliasvollrath.haushalt"
schema:
  app_url: url
  secret_key: password?
  reminder_hour: int(0,23)
  cron_token: password?
  admin_password: password?
  gemini_api_key: password?
  allow_legacy_sessions: bool
  apns_key_id: str?
  apns_team_id: str?
  apns_topic: str?
